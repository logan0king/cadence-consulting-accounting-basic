apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cadence-accounting-ingress
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - staging-api.cadence-accounting.com
    secretName: cadence-accounting-staging-tls
  rules:
  - host: staging-api.cadence-accounting.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cadence-accounting-service
            port:
              number: 80

